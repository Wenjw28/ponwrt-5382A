name: Build PonWrt HG5382A FullCone

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools swig unzip \
            zlib1g-dev file wget xz-utils curl bzip2

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config (HG5382A / an7581)
        run: |
          if [ -f configs/an7581.config ]; then
            cp configs/an7581.config .config
          else
            make defconfig
          fi
          echo 'CONFIG_TARGET_airoha=y' >> .config
          echo 'CONFIG_TARGET_airoha_an7581=y' >> .config
          echo 'CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-fullcone=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-offload=y' >> .config
          echo 'CONFIG_PACKAGE_firewall4=y' >> .config
          echo 'CONFIG_PACKAGE_nftables=y' >> .config
          echo 'CONFIG_PACKAGE_libnftnl=y' >> .config
          make defconfig

      - name: Stage 1 — Build host elfutils only
        run: |
          make tools/elfutils/compile -j"$(nproc)" || make tools/elfutils/compile V=s

      - name: Strip -Werror from host elfutils
        run: |
          set -e
          found=0
          for d in build_dir/host/elfutils-*; do
            [ -d "$d" ] || continue
            found=1
            find "$d" -type f \( -name Makefile -o -name Makefile.in \) \
              -exec sed -i 's/[[:space:]]-Werror\b//g;s/-Werror[[:space:]]//g;s/-Werror$//' {} +
            echo "patched: $d"
          done
          [ "$found" = 1 ] || echo "warning: host elfutils dir not found, skipped"

      - name: Stage 2 — Full build
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-hg5382a-fullcone
          path: |
            bin/targets/airoha/an7581/*hg5382a*squashfs-sysupgrade.itb
            bin/targets/airoha/an7581/*hg5382a*initramfs-recovery.itb
