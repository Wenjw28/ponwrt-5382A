name: Build PonWrt HG5382A FullCone

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools swig unzip \
            zlib1g-dev file wget xz-utils curl bzip2

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config (HG5382A / an7581)
        run: |
          if [ -f configs/an7581.config ]; then
            cp configs/an7581.config .config
          else
            make defconfig
          fi
          # 锁定目标平台为 an7581（5382A 所在平台）
          echo 'CONFIG_TARGET_airoha=y' >> .config
          echo 'CONFIG_TARGET_airoha_an7581=y' >> .config
          echo 'CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y' >> .config
          make defconfig

      - name: Inject nft-fullcone (No SFE)
        run: |
          set -e
          # 优先用内联补丁，外链失败也能编
          mkdir -p package/kernel/nft-fullcone
          cat > package/kernel/nft-fullcone/Makefile <<'MK'
include $(TOPDIR)/rules.mk
include $(INCLUDE_DIR)/kernel.mk

PKG_NAME:=nft-fullcone
PKG_RELEASE:=1
PKG_SOURCE_PROTO:=git
PKG_SOURCE_URL:=https://github.com/mufeng05/nft-fullcone.git
PKG_SOURCE_DATE:=2024-01-01
PKG_SOURCE_VERSION:=master

include $(INCLUDE_DIR)/package.mk

define KernelPackage/nft-fullcone
  SUBMENU:=Network Support
  TITLE:=nftables fullcone NAT support
  FILES:=$(PKG_BUILD_DIR)/nft_fullcone.ko
  AUTOLOAD:=$(call AutoLoad,45,nft_fullcone)
  DEPENDS:=@KERNEL_NFT_NAT
endef

define Build/Compile
	$(MAKE) -C "$(LINUX_DIR)" \
		$(KERNEL_MAKE_FLAGS) \
		M="$(PKG_BUILD_DIR)" \
		modules
endef

$(eval $(call KernelPackage,nft-fullcone))
MK

          # 追加 fullcone 相关包到 .config（若已存在则跳过）
          for opt in \
            CONFIG_PACKAGE_kmod-nft-fullcone \
            CONFIG_PACKAGE_kmod-nft-offload \
            CONFIG_PACKAGE_luci-app-turboacc \
            CONFIG_PACKAGE_firewall4 \
            CONFIG_PACKAGE_nftables \
            CONFIG_PACKAGE_libnftnl; do
            grep -q "^${opt}=" .config || echo "${opt}=y" >> .config
          done
          make defconfig

      - name: Stage 1 — Build host elfutils only
        run: |
          # 单独编 host elfutils，让它先解包出来
          make tools/elfutils/compile -j$(nproc) || make tools/elfutils/compile V=s

      - name: Strip -Werror from host elfutils (fix gettext_noop redefined)
        run: |
          set -e
          FOUND=0
          for d in build_dir/host/elfutils-*; do
            [ -d "$d" ] || continue
            FOUND=1
            find "$d" -type f \( -name Makefile -o -name Makefile.in \) \
              -exec sed -i 's/[[:space:]]-Werror\b//g; s/-Werror[[:space:]]//g; s/-Werror$//' {} +
            echo "patched: $d"
          done
          [ "$FOUND" = 1 ] || echo "warning: elfutils host dir not found, skip"

      - name: Stage 2 — Full build
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-hg5382a-fullcone
          path: |
            bin/targets/airoha/an7581/*hg5382a*squashfs-sysupgrade.itb
            bin/targets/airoha/an7581/*hg5382a*initramfs-recovery.itb
